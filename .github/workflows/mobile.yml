name: mobile
# Native packages (iOS / Android) and a WebKit smoke run. NOT on every push: it must never block the Pages deploy (deploy.yml).
# Start it by hand (Actions > mobile > Run workflow) or by pushing a tag like v1.0.3 (then the Android APK is attached to a GitHub release).
# Secrets and how to make them: packaging/README.md (Android signing, optional). Without any secret the jobs still make DEBUG / UNSIGNED builds.
# IMPORTANT: this file was written without being able to run it (no GitHub runner, no Android SDK, no macOS in the authoring sandbox). The first run may need small fixes.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "which jobs to run: all / android / ios / webkit"
        default: all
      release:
        description: "also publish a GitHub release page with the packages (Releases tab)"
        type: boolean
        default: false
      version:
        description: "release version such as v0.2.0 (empty = v0.1.<run number>)"
        default: ""
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 18 * * 6"   # every Saturday evening (UTC): a new release when there are commits since the last one
permissions:
  contents: write   # (a release is created and the packages are attached to it)
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  VERSION_CODE: ${{ github.run_number }}

jobs:
  plan:
    # decides WHAT runs and WHETHER a release page is made (so that every way of starting it, a tag, one click or the weekly timer, ends the same way)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      release: ${{ steps.p.outputs.release }}
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
      webkit: ${{ steps.p.outputs.webkit }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          JOBS: ${{ inputs.jobs }}
          REL: ${{ inputs.release }}
          VER: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          release=false; version="v0.1.$RUN"; jobs=all
          if [ "$EVENT" = push ]; then release=true; version="$REF_NAME"
          elif [ "$EVENT" = workflow_dispatch ]; then jobs="${JOBS:-all}"; [ "$REL" = true ] && release=true; [ -n "$VER" ] && version="$VER"
          elif [ "$EVENT" = schedule ]; then
            last=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -z "$last" ] || [ -n "$(git log "$last"..HEAD --oneline | head -1)" ]; then release=true; else echo "no commits since $last: nothing to release"; fi
            [ "$release" = false ] && jobs=none
          fi
          for j in android ios webkit; do
            if [ "$jobs" = all ] || [ "$jobs" = "$j" ]; then echo "$j=true" >> "$GITHUB_OUTPUT"; else echo "$j=false" >> "$GITHUB_OUTPUT"; fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, release $release, jobs $jobs"

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    env: { VERSION_NAME: "${{ needs.plan.outputs.version }}" }
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }   # Capacitor 8: JDK 21
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools" }   # (the default also asks for the old "tools" package, which no longer exists: the first run failed there)
      - run: npm ci
      - name: Build the packaged web app and copy it into android/
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          npm run build:mobile
          npx cap sync android
      - name: Debug APK (installable for testing, signed with the debug key)
        working-directory: android
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: learning-center-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Decode the release keystore (only when the secret exists)
        id: ks
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release AAB (signed when the secrets exist, else unsigned)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.ks.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: learning-center-release-aab${{ steps.ks.outputs.signed == 'true' && '-signed' || '-UNSIGNED' }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    # No Apple account is needed: this builds for the SIMULATOR (no signing). A signed .ipa for TestFlight needs the Apple Developer Program: packaging/README.md.
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the packaged web app and copy it into ios/
        run: |
          npm run build:mobile
          npx cap sync ios
      - name: Build for the iOS simulator (also the first compile of the Swift print plugin in AppDelegate.swift)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Smoke test in the simulator (installs, starts, takes a screenshot)
        run: |
          APP=$(find build/ios -name "App.app" -path "*Debug-iphonesimulator*" | head -1)
          ID=$(xcrun simctl list devices available | grep -m1 "iPad" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -z "$ID" ] && ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl install "$ID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl launch "$ID" "$BUNDLE"
          sleep 15
          xcrun simctl io "$ID" screenshot ios-smoke.png
          # the app must still be running after 15 s (a crash at start would have ended the process)
          xcrun simctl spawn "$ID" launchctl list | grep -q "UIKitApplication:$BUNDLE"
      - name: Zip the simulator app
        run: |
          APP=$(find build/ios -name "App.app" -path "*Debug-iphonesimulator*" | head -1)
          ditto -c -k --keepParent "$APP" learning-center-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: learning-center-ios-simulator
          path: |
            learning-center-ios-simulator.zip
            ios-smoke.png
          if-no-files-found: warn

  webkit:
    # The same code in the WebKit engine (Safari / every iPhone and iPad web view): a small smoke set of the e2e suites against the PRODUCTION build.
    needs: plan
    if: needs.plan.outputs.webkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: BASE_PATH=/ npm run build
      - name: Smoke run in WebKit (scripts/webkit-smoke.cjs)
        run: |
          export BASE_PATH=/
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          APP_URL=http://localhost:4173/ BROWSER=webkit node scripts/webkit-smoke.cjs

  release:
    # one release page (Releases tab) with everything that was built: the Android test APK and the iOS SIMULATOR app (a signed iOS .ipa needs the owner's own Apple ID: packaging/README.md, section 4)
    needs: [plan, android, ios]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: pkg, pattern: "learning-center-*", merge-multiple: true }
      - name: Make the release
        run: |
          set -e
          ls -R pkg || true
          files=()
          apk=$(ls pkg/*.apk 2>/dev/null | grep -v release | head -1 || true)
          if [ -n "$apk" ]; then cp "$apk" "learning-center-$VERSION-android-debug.apk"; files+=("learning-center-$VERSION-android-debug.apk"); fi
          if [ -f pkg/learning-center-ios-simulator.zip ]; then cp pkg/learning-center-ios-simulator.zip "learning-center-$VERSION-ios-simulator.zip"; files+=("learning-center-$VERSION-ios-simulator.zip"); fi
          cat > notes.md <<EOF
          ## 学习乐园 $VERSION

          - **网页版（最新）**：https://${GITHUB_REPOSITORY_OWNER}.github.io/LearningCenter/ （iPad / iPhone 用 Safari 打开，“分享 → 添加到主屏幕”）
          - **Android**：下载 \`android-debug.apk\` 直接安装（测试版，调试签名）。
          - **iOS 模拟器**：下载 \`ios-simulator.zip\`，解压后把 .app 拖进 Mac 上已打开的 iOS 模拟器。只能在模拟器里用。
          - **iPad / iPhone 真机**：这里不提供安装包（必须用你自己的 Apple ID 在 Xcode 里签名），步骤见 packaging/README.md 第 4 节。

          > 内容由模型编写，尚未经教师校对；原生功能（打印、分享、相机）在真机上尚未全面测试。
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${files[@]}" --clobber
          else
            gh release create "$VERSION" "${files[@]}" --target "$GITHUB_SHA" --title "学习乐园 $VERSION" --notes-file notes.md --generate-notes --prerelease
          fi

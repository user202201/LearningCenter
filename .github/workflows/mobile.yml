name: mobile
# Native packages (iOS / Android) and a WebKit smoke run. NOT on every push: it must never block the Pages deploy (deploy.yml).
# Start it by hand (Actions > mobile > Run workflow) or by pushing a tag like v1.0.3 (then the Android APK is attached to a GitHub release).
# Secrets and how to make them: packaging/README.md (Android signing, optional). Without any secret the jobs still make DEBUG / UNSIGNED builds.
# IMPORTANT: this file was written without being able to run it (no GitHub runner, no Android SDK, no macOS in the authoring sandbox). The first run may need small fixes.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "which jobs to run: all / android / ios / webkit"
        default: all
  push:
    tags: ["v*"]
permissions:
  contents: write   # (a tag build attaches the APK to a release)
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
  VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }   # Capacitor 8: JDK 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build the packaged web app and copy it into android/
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          npm run build:mobile
          npx cap sync android
      - name: Debug APK (installable for testing, signed with the debug key)
        working-directory: android
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: learning-center-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Decode the release keystore (only when the secret exists)
        id: ks
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release AAB (signed when the secrets exist, else unsigned)
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.ks.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: learning-center-release-aab${{ steps.ks.outputs.signed == 'true' && '-signed' || '-UNSIGNED' }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Attach the debug APK to the GitHub release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          prerelease: true

  ios:
    # No Apple account is needed: this builds for the SIMULATOR (no signing). A signed .ipa for TestFlight needs the Apple Developer Program: packaging/README.md.
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'ios'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the packaged web app and copy it into ios/
        run: |
          npm run build:mobile
          npx cap sync ios
      - name: Build for the iOS simulator (also the first compile of the Swift print plugin in AppDelegate.swift)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Smoke test in the simulator (installs, starts, takes a screenshot)
        run: |
          APP=$(find build/ios -name "App.app" -path "*Debug-iphonesimulator*" | head -1)
          ID=$(xcrun simctl list devices available | grep -m1 "iPad" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -z "$ID" ] && ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl install "$ID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl launch "$ID" "$BUNDLE"
          sleep 15
          xcrun simctl io "$ID" screenshot ios-smoke.png
          # the app must still be running after 15 s (a crash at start would have ended the process)
          xcrun simctl spawn "$ID" launchctl list | grep -q "UIKitApplication:$BUNDLE"
      - name: Zip the simulator app
        run: |
          APP=$(find build/ios -name "App.app" -path "*Debug-iphonesimulator*" | head -1)
          ditto -c -k --keepParent "$APP" learning-center-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: learning-center-ios-simulator
          path: |
            learning-center-ios-simulator.zip
            ios-smoke.png
          if-no-files-found: warn

  webkit:
    # The same code in the WebKit engine (Safari / every iPhone and iPad web view): a small smoke set of the e2e suites against the PRODUCTION build.
    if: github.event_name == 'push' || inputs.jobs == 'all' || inputs.jobs == 'webkit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: BASE_PATH=/ npm run build
      - name: Smoke run in WebKit (scripts/webkit-smoke.cjs)
        run: |
          export BASE_PATH=/
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          APP_URL=http://localhost:4173/ BROWSER=webkit node scripts/webkit-smoke.cjs
